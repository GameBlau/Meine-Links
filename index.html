<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameBlauX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#4F8EFF;
  --purple:#9F7AFF;
  --cyan:#2DD4BF;
  --bg:#060610;
  --card-bg:rgba(8,8,22,0.88);
  --yt:#FF2B2B;
  --dc:#5865F2;
}

html,body{
  width:100%;min-height:100%;
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);
  color:#fff;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
}

/* ── Canvas particle layer ── */
#bg-canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  z-index:0;
  pointer-events:none;
}

/* ── Ambient orbs ── */
.orbs{
  position:fixed;inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  will-change:transform;
}
.o1{width:420px;height:420px;background:radial-gradient(circle,rgba(79,142,255,.18),transparent 70%);top:-80px;left:-80px;}
.o2{width:500px;height:500px;background:radial-gradient(circle,rgba(159,122,255,.15),transparent 70%);bottom:-120px;right:-120px;}
.o3{width:280px;height:280px;background:radial-gradient(circle,rgba(45,212,191,.10),transparent 70%);top:60%;left:55%;}

/* ── Cursor glow ── */
#cursor-glow{
  position:fixed;
  width:280px;height:280px;
  border-radius:50%;
  pointer-events:none;
  z-index:2;
  background:radial-gradient(circle,rgba(79,142,255,.07) 0%,transparent 70%);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}

/* ── Card container ── */
.wrap{
  position:relative;z-index:10;
  width:90%;max-width:390px;
  perspective:900px;
  opacity:0;
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .2s forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(48px) scale(.93)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ── Card ── */
.card{
  background:var(--card-bg);
  border-radius:28px;
  padding:50px 36px 42px;
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:
    0 0 0 1px rgba(79,142,255,.04),
    0 30px 70px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.06);
  transform-style:preserve-3d;
  transition:box-shadow .35s ease,transform .1s ease;
  position:relative;
  overflow:hidden;
}

/* top gradient line */
.card::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(79,142,255,.55),rgba(159,122,255,.55),transparent);
}

/* inner spotlight on mouse */
.card-spot{
  position:absolute;inset:0;
  border-radius:28px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
  background:radial-gradient(circle 180px at 50% 50%,rgba(79,142,255,.08),transparent);
}

/* shimmer sweep */
.card::before{
  content:'';
  position:absolute;
  top:0;left:-120%;
  width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.025),transparent);
  animation:sweep 5s ease-in-out infinite;
}
@keyframes sweep{0%{left:-120%}100%{left:200%}}

/* ── Avatar ── */
.avatar-ring-wrap{
  display:flex;justify-content:center;
  margin-bottom:14px;
  opacity:0;animation:fi .6s ease .7s forwards;
}
.avatar-outer{
  width:80px;height:80px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.avatar-spinner{
  position:absolute;inset:-5px;
  border-radius:50%;
  background:conic-gradient(from 0deg,var(--blue),var(--purple),var(--cyan),var(--blue));
  animation:spin 4s linear infinite;
}
.avatar-mask{
  position:absolute;inset:2px;
  border-radius:50%;
  background:var(--bg);
}
.avatar-inner{
  position:relative;z-index:1;
  width:72px;height:72px;
  border-radius:50%;
  background:linear-gradient(135deg,#1a1a40,#0e0e2a);
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',monospace;
  font-size:24px;font-weight:900;
  color:#fff;
  box-shadow:0 0 0 1px rgba(79,142,255,.15),0 0 28px rgba(79,142,255,.2);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Headings ── */
h1{
  font-family:'Orbitron',monospace;
  font-size:22px;font-weight:900;
  letter-spacing:3px;text-align:center;
  background:linear-gradient(135deg,#fff 30%,rgba(159,122,255,.85) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:5px;
  opacity:0;animation:fi .6s ease .8s forwards;
}
.sub{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,.28);font-weight:300;
  text-align:center;margin-bottom:38px;
  opacity:0;animation:fi .6s ease .9s forwards;
}
@keyframes fi{to{opacity:1}}

/* ── Buttons ── */
.btns{display:flex;flex-direction:column;gap:14px;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:13px;
  padding:19px 26px;
  text-decoration:none;
  border-radius:18px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:15px;letter-spacing:.3px;
  color:#fff;
  position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  opacity:0;
}
.btns .btn:nth-child(1){animation:fi .5s ease 1s forwards}
.btns .btn:nth-child(2){animation:fi .5s ease 1.1s forwards}

/* ripple */
.btn::before{
  content:'';
  position:absolute;top:50%;left:50%;
  width:0;height:0;
  background:rgba(255,255,255,.14);
  border-radius:50%;
  transform:translate(-50%,-50%);
  transition:width .55s ease,height .55s ease,opacity .55s ease;
  opacity:0;
}
.btn:hover::before{width:360px;height:360px;opacity:1}

/* shine sweep on hover */
.btn-shine{
  position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);
  transform:translateX(-100%);
  transition:transform .45s ease;
}
.btn:hover .btn-shine{transform:translateX(100%)}

.btn i{font-size:22px;flex-shrink:0;position:relative;z-index:1;}
.btn span{position:relative;z-index:1;}

/* YouTube */
.btn-yt{
  background:linear-gradient(135deg,#FF2B2B 0%,#CC1010 100%);
  box-shadow:0 8px 28px rgba(255,43,43,.22);
}
.btn-yt:hover{
  transform:translateY(-4px) scale(1.025);
  box-shadow:0 18px 48px rgba(255,43,43,.42),0 0 80px rgba(255,43,43,.12);
}
.btn-yt:active{transform:translateY(-1px) scale(.99);}

/* Discord */
.btn-dc{
  background:linear-gradient(135deg,#5865F2 0%,#4350D0 100%);
  box-shadow:0 8px 28px rgba(88,101,242,.22);
}
.btn-dc:hover{
  transform:translateY(-4px) scale(1.025);
  box-shadow:0 18px 48px rgba(88,101,242,.42),0 0 80px rgba(88,101,242,.12);
}
.btn-dc:active{transform:translateY(-1px) scale(.99);}

/* ── Footer ── */
.footer{
  text-align:center;margin-top:28px;
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,.12);font-weight:300;
  opacity:0;animation:fi .6s ease 1.3s forwards;
}

/* ── Scan-line overlay ── */
.scan{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.018) 2px,rgba(0,0,0,.018) 4px);
}

/* ── Responsive ── */
@media(max-width:480px){
  .card{padding:36px 22px 30px;border-radius:22px;}
  h1{font-size:18px;letter-spacing:2px;}
  .btn{padding:16px 20px;font-size:14px;}
  .avatar-inner{width:64px;height:64px;font-size:20px;}
  .avatar-outer{width:70px;height:70px;}
  .avatar-spinner{inset:-4px;}
}

/* Reduce motion */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="orbs">
  <div class="orb o1" id="o1"></div>
  <div class="orb o2" id="o2"></div>
  <div class="orb o3" id="o3"></div>
</div>

<div id="cursor-glow"></div>
<div class="scan"></div>

<div class="wrap" id="wrap">
  <div class="card" id="card">
    <div class="card-spot" id="spot"></div>

    <div class="avatar-ring-wrap">
      <div class="avatar-outer">
        <div class="avatar-spinner"></div>
        <div class="avatar-mask"></div>
        <div class="avatar-inner">G</div>
      </div>
    </div>

    <h1>GameBlauX</h1>
    <p class="sub">Creator · Gamer · Community</p>

    <div class="btns">
      <a href="https://www.youtube.com/@GameBlauX" class="btn btn-yt" target="_blank" rel="noopener noreferrer">
        <div class="btn-shine"></div>
        <i class="fab fa-youtube"></i>
        <span>YouTube Kanal</span>
      </a>
      <a href="https://discord.gg/9jJZBbQDeN" class="btn btn-dc" target="_blank" rel="noopener noreferrer">
        <div class="btn-shine"></div>
        <i class="fab fa-discord"></i>
        <span>Discord Server</span>
      </a>
    </div>
  </div>
  <div class="footer">© 2025 GameBlauX</div>
</div>

<script>
/* ── Particle canvas ── */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2 };
const NUM = Math.min(90, Math.floor(window.innerWidth * window.innerHeight / 10000));

class Particle {
  constructor(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 10;
    this.r = Math.random() * 1.4 + 0.3;
    this.vx = (Math.random() - .5) * .35;
    this.vy = -(Math.random() * .4 + .08);
    this.alpha = Math.random() * .45 + .08;
    this.hue = Math.random() > .55 ? 220 : 265;
    this.phase = Math.random() * Math.PI * 2;
    this.freq = .008 + Math.random() * .012;
  }
  update() {
    this.phase += this.freq;
    this.x += this.vx;
    this.y += this.vy;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 180) { this.x += dx * .0018; this.y += dy * .0018; }
    if (this.y < -10 || this.x < -10 || this.x > W + 10) {
      this.x = Math.random() * W; this.y = H + 10;
      this.vx = (Math.random() - .5) * .35;
    }
  }
  draw() {
    const a = this.alpha * (.55 + .45 * Math.sin(this.phase));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},82%,72%,${a})`;
    ctx.fill();
  }
}

const particles = Array.from({ length: NUM }, (_, i) => new Particle(true));

function drawLines() {
  const max = 130;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.hypot(dx, dy);
      if (d < max) {
        const a = (1 - d / max) * .07;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(110,165,255,${a})`;
        ctx.lineWidth = .6;
        ctx.stroke();
      }
    }
  }
}

/* Mouse connection burst */
function drawMouseLines() {
  particles.forEach(p => {
    const d = Math.hypot(mouse.x - p.x, mouse.y - p.y);
    if (d < 140) {
      const a = (1 - d / 140) * .12;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.strokeStyle = `rgba(150,190,255,${a})`;
      ctx.lineWidth = .5;
      ctx.stroke();
    }
  });
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawLines();
  drawMouseLines();
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
}
loop();

/* ── Smooth cursor tracking ── */
const cursorGlow = document.getElementById('cursor-glow');
const card = document.getElementById('card');
const spot = document.getElementById('spot');
const o1 = document.getElementById('o1');
const o2 = document.getElementById('o2');
const o3 = document.getElementById('o3');

let tx = W / 2, ty = H / 2;
let cx = W / 2, cy = H / 2;
let isTouching = false;

document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  tx = t.clientX; ty = t.clientY;
  mouse.x = t.clientX; mouse.y = t.clientY;
  isTouching = true;
}, { passive: true });

/* ── Card 3D tilt ── */
let cardTiltX = 0, cardTiltY = 0;
let targetTiltX = 0, targetTiltY = 0;
let isHoveringCard = false;

card.addEventListener('mouseenter', () => { isHoveringCard = true; spot.style.opacity = '1'; });
card.addEventListener('mouseleave', () => {
  isHoveringCard = false;
  targetTiltX = 0; targetTiltY = 0;
  spot.style.opacity = '0';
});
card.addEventListener('mousemove', e => {
  const r = card.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const px = (x / r.width - .5), py = (y / r.height - .5);
  targetTiltX = -py * 10;
  targetTiltY = px * 10;
  /* card spotlight */
  spot.style.background = `radial-gradient(circle 180px at ${x}px ${y}px,rgba(79,142,255,.1),transparent)`;
});

function raf() {
  cx += (tx - cx) * .09;
  cy += (ty - cy) * .09;

  if (!isTouching) {
    mouse.x = cx; mouse.y = cy;
  }

  /* cursor glow */
  cursorGlow.style.left = cx + 'px';
  cursorGlow.style.top = cy + 'px';

  /* orb parallax */
  const nx = (cx / W - .5), ny = (cy / H - .5);
  o1.style.transform = `translate(${nx * 35}px,${ny * 35}px)`;
  o2.style.transform = `translate(${-nx * 25}px,${-ny * 25}px)`;
  o3.style.transform = `translate(${nx * 18}px,${ny * 18}px)`;

  /* card tilt lerp */
  cardTiltX += (targetTiltX - cardTiltX) * .1;
  cardTiltY += (targetTiltY - cardTiltY) * .1;

  if (!isHoveringCard) {
    /* subtle ambient tilt from global cursor */
    const rect = card.getBoundingClientRect();
    const ddx = (cx - (rect.left + rect.width / 2)) / W;
    const ddy = (cy - (rect.top + rect.height / 2)) / H;
    cardTiltX += (-ddy * 3 - cardTiltX) * .04;
    cardTiltY += (ddx * 3 - cardTiltY) * .04;
  }

  card.style.transform = `perspective(900px) rotateX(${cardTiltX}deg) rotateY(${cardTiltY}deg)`;

  requestAnimationFrame(raf);
}
raf();
</script>
</body>
</html>
